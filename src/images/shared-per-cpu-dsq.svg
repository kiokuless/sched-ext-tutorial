<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
<title id="title">共有 DSQ と CPU ごとの DSQ</title><desc id="desc">左は一つの共有 DSQ に A、B、C が並び CPU 0 と CPU 1 へ分岐する。右は CPU ごとの独自 DSQ に A、C と B を分け、それぞれの CPU へ渡す。ローカル DSQ と callback は省略。</desc>
