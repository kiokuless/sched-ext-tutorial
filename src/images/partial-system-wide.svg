<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">partial と system-wide の適用範囲</title><desc id="desc">同じ五つのタスクを左右で比較。partial では periodic と hog だけが自作 scheduler に入り、shell とサービスは fair class に残る。system-wide では五つとも自作 scheduler に入る。</desc>
