name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Check the book and host tools
        run: make check
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: book

  scheduler-builds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-19 libbpf-dev libelf-dev pkg-config
      - name: Build every scheduler checkpoint
        env:
          BPF_CLANG: clang-19
        run: |
          for manifest in lab/Cargo.toml checkpoints/*/Cargo.toml; do
            CARGO_TARGET_DIR=target/ci-schedulers cargo build --release --manifest-path "$manifest"
            CARGO_TARGET_DIR=target/ci-schedulers cargo clean --release --package scx_oreore --manifest-path "$manifest"
          done

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - host-checks
      - scheduler-builds
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
